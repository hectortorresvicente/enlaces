<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7faf9">
  <meta name="description" content="Enlaces profesionales, proyectos y contacto de Hèctor Torres Vicente.">
  <meta property="og:title" content="Hèctor Torres Vicente · Enlaces y contacto">
  <meta property="og:description" content="Encuentra mis redes, proyectos y formas de contacto en un único lugar.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hectortorresvicente.github.io/enlaces/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Hèctor Torres Vicente · Enlaces</title>
  <style>
    :root {--bg:#f7faf9;--ink:#192131;--muted:#666c79;--card:#fff;--border:#e3ecea;--pink:#198f90;--orange:#5ccbbb;--ring:#28b6b5;--radius:22px;}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse 45% 25% at 90% 0%,rgba(27,177,169,.11),transparent 80%),radial-gradient(ellipse 35% 30% at 0% 45%,rgba(74,194,188,.09),transparent 83%),var(--bg)}
    a{text-decoration:none;color:inherit}
    .shell{width:min(100% - 32px,580px);margin:0 auto;padding:42px 0 45px}
    .status:before{content:"";width:7px;height:7px;border-radius:50%;background:#69aa89}
    .hero{text-align:center;margin:0 auto 30px}
    .avatar{position:relative;width:98px;height:98px;display:grid;place-items:center;margin:0 auto 20px;border-radius:32px;color:#fff;font-size:35px;letter-spacing:-.08em;font-weight:750;background:linear-gradient(135deg,#70d6c9 2%,#22bdb5 54%,#087c8b 98%);box-shadow:0 16px 35px rgba(14,147,150,.20)}
    .avatar:after{content:"";position:absolute;inset:-6px;border:1px solid rgba(18,156,151,.19);border-radius:38px}
    h1{font-size:clamp(1.85rem,6vw,2.3rem);letter-spacing:-.052em;margin:0 0 9px;line-height:1.16}
    .descr{max-width:405px;margin:12px auto 0;font-size:.88rem;color:#777885;line-height:1.65}
    .section{margin-top:27px}
    .section h2{font-size:.74rem;font-weight:850;letter-spacing:.15em;text-transform:uppercase;color:#708789;margin:0 6px 12px}
    .cards{display:grid;gap:11px}
    .link-card{display:flex;align-items:center;gap:14px;min-height:80px;border-radius:var(--radius);border:1px solid var(--border);background:rgba(255,255,255,.92);padding:14px 15px;box-shadow:0 5px 17px rgba(32,29,39,.025);transition:transform .17s ease,box-shadow .17s ease,border-color .17s ease}
    .link-card:hover,.link-card:focus-visible{transform:translateY(-3px);box-shadow:0 12px 24px rgba(32,29,39,.07);border-color:#a9dfdc;outline:none}
    .icon-wrap{width:48px;height:48px;display:grid;place-items:center;flex-shrink:0;border-radius:16px;background:#ebf7f5;color:#168d8c}
    .icon-wrap svg{width:24px;height:24px}
    .icon-wrap.instagram{color:#149b98;background:#e6f8f6}
    .icon-wrap.linkedin{color:#0966c2;background:#ebf4ff}
    .icon-wrap.github{color:#222e40;background:#eef0f4}
    .icon-wrap.correo{color:#168f8e;background:#e7f6f3}
    .icon-wrap.telefono{color:#23936e;background:#eaf8f2}
    .icon-wrap.web{color:#6f4ec3;background:#f2edff}
    .card-body{min-width:0;flex:1}
    .card-title{display:block;font-weight:730;font-size:1rem;letter-spacing:-.015em}
    .card-subtitle{display:block;color:#777783;margin-top:3px;font-size:.83rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .arrow{width:20px;height:20px;flex-shrink:0;color:#a1a0a5}
    .action-row{display:flex;gap:10px;margin-top:21px}
    .soft-button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border:1px solid #dbeae8;background:#fff;border-radius:16px;font:inherit;font-size:.85rem;color:#514a58;font-weight:700;cursor:pointer;transition:background .2s}
    .soft-button:hover,.soft-button:focus-visible{background:#ecfaf8;outline:2px solid #b5e7df;outline-offset:2px}
    .soft-button svg{width:17px;height:17px}
    .qr-panel{display:none;text-align:center;margin-top:15px;padding:24px 12px 19px;background:#fff;border:1px solid var(--border);border-radius:22px}
    .qr-panel.open{display:block}
    .qr-panel img{width:220px;max-width:90%;height:auto;aspect-ratio:1;object-fit:contain}
    .qr-panel p{color:#777783;font-size:.79rem;line-height:1.5;margin:7px 0 2px}
    .footer{text-align:center;font-size:.77rem;color:#99929a;margin:29px 0 0}
    .notice{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#192131;color:white;padding:12px 18px;border-radius:12px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;box-shadow:0 10px 25px #19213122}
    .notice.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:420px){.shell{width:min(100% - 28px,580px);padding-top:25px}.link-card{min-height:76px}.action-row{flex-wrap:wrap}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-label="Presentación">
      <div class="avatar" aria-hidden="true">HT</div>
      <h1 id="nombre">Hèctor Torres Vicente</h1>
      <p class="descr" id="bio">Mis redes, proyectos y datos de contacto en un único lugar.</p>
    </section>
    <nav id="enlaces" aria-label="Mis enlaces">
      <section class="section"><h2>Redes y proyectos</h2><div class="cards" id="grupo-redes"></div></section>
      <section class="section"><h2>Contacto directo</h2><div class="cards" id="grupo-contacto"></div></section>
      <section class="section" id="seccion-paginas" hidden><h2>Otras páginas y proyectos</h2><div class="cards" id="grupo-paginas"></div></section>
    </nav>
    <div class="action-row">
      <button class="soft-button" id="compartir" type="button" aria-label="Compartir esta página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.8 6.6-4.2M8.7 13.2l6.6 4.2"/></svg>
        Compartir página
      </button>
      <button class="soft-button" type="button" id="mostrarqr" aria-expanded="false" aria-controls="panelqr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v3M18 21h3M14 21v-2"/></svg>
        Ver mi QR
      </button>
    </div>
    <section id="panelqr" class="qr-panel" aria-label="Código QR de esta página">
      <img src="qr-enlaces.png" loading="lazy" alt="Código QR que abre esta página de enlaces">
      <p>Escanéalo para abrir esta página desde otro dispositivo.</p>
    </section>
    <footer class="footer">Un único lugar para conectar y compartir.</footer>
  </main>
  <div id="aviso" class="notice" role="status" aria-live="polite"></div>
  <script src="enlaces.js"></script>
  <script>
    'use strict';
    const ICONS = {
      instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/>',
      linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7m0-10v.1M12 17v-7m0 3.2a3.2 3.2 0 0 1 6.4 0V17"/>',
      github: '<path d="M9 19.1c-4.5 1.3-4.5-2.2-6.3-2.7M15 21v-3.6c0-1 .1-1.4-.5-2 2.6-.3 5.3-1.2 5.3-5.8 0-1.3-.4-2.5-1.2-3.4.1-.4.5-1.7-.1-3.3 0 0-1-.3-3.4 1.3a11.9 11.9 0 0 0-6.2 0C6.5 2.6 5.5 3 5.5 3c-.6 1.6-.2 2.9-.1 3.3-.8.9-1.2 2.1-1.2 3.4 0 4.6 2.7 5.5 5.3 5.8-.6.6-.6 1.1-.6 2V21"/>',
      correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
      telefono: '<path d="M21 16.4v3a2 2 0 0 1-2.2 2A17.8 17.8 0 0 1 2.6 5.2 2 2 0 0 1 4.6 3h3a2 2 0 0 1 2 1.7l.5 2.7a2 2 0 0 1-.6 2L7.7 11a14 14 0 0 0 5.3 5.3l1.6-1.8a2 2 0 0 1 2-.6l2.7.5A2 2 0 0 1 21 16.4z"/>',
      web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/>'
    };
    const ARROW = '<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
    const svg = (name) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name] || ICONS.web)+'</svg>';
    const cfg = window.TARJETA || {};
    for (const [id, prop] of [['nombre','nombre'],['bio','bio']]) {
      if (cfg[prop]) document.getElementById(id).textContent=cfg[prop];
    }
    const groups = {redes:document.getElementById('grupo-redes'),contacto:document.getElementById('grupo-contacto'),paginas:document.getElementById('grupo-paginas')};
    for (const item of (cfg.enlaces || [])) {
      const group=groups[item.grupo];
      if (!group || !item.url || !item.titulo) continue;
      const a=document.createElement('a');a.className='link-card';a.href=item.url;
      if (/^https:\/\//i.test(item.url)){a.target='_blank';a.rel='noopener noreferrer';}
      else if(!/^(mailto:|tel:)/i.test(item.url)){continue;}
      const mark=document.createElement('span');mark.className='icon-wrap '+(ICONS[item.icono]?item.icono:'web');mark.innerHTML=svg(item.icono);
      const body=document.createElement('span');body.className='card-body';
      const title=document.createElement('span');title.className='card-title';title.textContent=item.titulo;
      const subtitle=document.createElement('span');subtitle.className='card-subtitle';subtitle.textContent=item.detalle || '';
      body.append(title,subtitle);a.append(mark,body);a.insertAdjacentHTML('beforeend',ARROW);group.append(a);
    }
    if(groups.paginas.children.length)document.getElementById('seccion-paginas').hidden=false;
    const siteUrl=cfg.url || 'https://hectortorresvicente.github.io/enlaces/';
    let noticeTimeout;
    function toast(message){let el=document.getElementById('aviso');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimeout);noticeTimeout=setTimeout(()=>el.classList.remove('show'),2600);}
    document.getElementById('mostrarqr').addEventListener('click',()=>{
      const panel=document.getElementById('panelqr');const open=panel.classList.toggle('open');
      document.getElementById('mostrarqr').setAttribute('aria-expanded',String(open));
      if(open)panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    document.getElementById('compartir').addEventListener('click',async()=>{
      try{
        if(navigator.share){await navigator.share({title:cfg.nombre || 'Mis enlaces',url:siteUrl});return;}
        if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(siteUrl);toast('Enlace copiado');return;}
        window.prompt('Copia el enlace de mi página:',siteUrl);
      }catch(e){if(e.name!=='AbortError')window.prompt('Copia el enlace de mi página:',siteUrl);}
    });
  </script>
</body>
</html>
